<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알티노 라이트 복도 순회</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:12px 12px 210px;background:#111;color:#eee}
  h2{font-size:1rem;margin:18px 0 8px}
  button,select,input{font-size:1rem;padding:12px;border-radius:10px;border:1px solid #555;background:#222;color:#eee}
  button:disabled{opacity:.4}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;align-items:center}
  .row>button{flex:1}
  #status{position:fixed;left:12px;right:12px;bottom:100px;padding:10px;border-radius:10px;background:#333;border:1px solid #888;white-space:pre-line}
  #diag{font-size:.8rem;color:#aaa;word-break:break-all}
  table{width:100%;text-align:center;border-collapse:collapse}
  td,th{border:1px solid #444;padding:6px 2px}
  input[type=number]{width:90px}
  #stop{position:fixed;left:12px;right:12px;bottom:12px;height:80px;font-size:1.6rem;font-weight:700;background:#c62828;border:0}
</style>
</head>
<body>
<div id="status">연결 안 됨</div>

<h2>1. 연결</h2>
<div class="row"><button id="connect">알티노 연결</button></div>

<h2>2. 센서 확인 (손을 대서 위치 찾기)</h2>
<table>
  <tr><th>ir1</th><th>ir2</th><th>ir3</th><th>ir4</th><th>ir5</th><th>ir6</th></tr>
  <tr id="raw"><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>
</table>
<div class="row">왼쪽 앞 <select id="sL"></select> 가운데 <select id="sC"></select> 오른쪽 앞 <select id="sR"></select></div>
<div class="row">
  <button id="calEmpty">① 앞을 비우고 누르기</button>
  <button id="calHand">② 앞 3곳 10cm를 판으로 막고 누르기</button>
</div>
<div id="strength">보정 전</div>
<div id="diag">받은 데이터 없음</div>

<h2>3. 바퀴 시험 (바퀴를 바닥에서 띄우고)</h2>
<div class="row">
  <button data-test="f">전진 1초</button><button data-test="b">후진 1초</button>
  <button data-test="l">왼쪽 조향</button><button data-test="r">오른쪽 조향</button>
</div>

<h2>4. 조정값</h2>
<div class="row">속도 <input type="number" id="speed" value="300" min="200" max="600" step="50">
조향 <input type="number" id="angle" value="100" min="20" max="127"></div>
<div class="row">직진 보정 <input type="number" id="trim" value="0" min="-30" max="30">
유턴 횟수 <input type="number" id="turns" value="3" min="1" max="8"></div>

<h2>5. 순회</h2>
<div class="row"><button id="start">순회 시작 (3초 뒤 출발)</button></div>

<button id="stop">■ 정지</button>

<script>
'use strict';
const SVC    = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
const WRITE  = '49535343-8841-43f4-a8d4-ecbe34729bb3';
const NOTIFY = '49535343-1e4d-4bd9-ba61-23c647249616';

const TH_SIDE = 40, TH_FRONT = 45, TH_DANGER = 75;
const BACK_MS = 700, TURN_FWD_MS = 1200, TURN_BACK_MS = 1000;
const STUCK_LIMIT = 3, STALE_MS = 1200;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const status = t => { $('status').textContent = t; };

let device = null, writeCh = null, wakeLock = null;
let speedNow = 0, steerNow = 0;
let ir = null, lastRx = 0, rx = [];
let rxBytes = 0, rxFrames = 0, rxHex = '';
let cal = { empty: null, hand: null };
let runId = 0;            // 바뀌면 진행 중인 동작이 모두 멈춤
let running = false;

/* ───── 설정 저장 ───── */
const FIELDS = ['sL', 'sC', 'sR', 'speed', 'angle', 'trim', 'turns'];
['sL', 'sC', 'sR'].forEach((id, i) => {
  for (let n = 0; n < 6; n++) $(id).add(new Option('ir' + (n + 1), n));
  $(id).value = i;
});
function save() {
  try {
    const v = {}; FIELDS.forEach(k => v[k] = $(k).value);
    localStorage.setItem('altinoPatrol', JSON.stringify({ v, cal }));
  } catch (e) {}
}
try {
  const s = JSON.parse(localStorage.getItem('altinoPatrol'));
  if (s) { FIELDS.forEach(k => $(k).value = s.v[k]); cal = s.cal; }
} catch (e) {}
FIELDS.forEach(k => $(k).addEventListener('change', save));

/* ───── 통신 (라이트 22바이트) ───── */
function buildFrame(speed, steer) {
  const b = new Uint8Array(22);
  const s = clamp(Math.round(steer), -127, 127);
  const v = clamp(Math.round(speed), -1000, 1000);
  const m = v < 0 ? 0xFFFF + v : v;
  b[0] = 0x02; b[1] = 0x10; b[3] = 0x01; b[4] = 0x01;
  b[5] = s < 0 ? (~(-s)) & 0xFF : s;
  b[6] = b[8] = m >> 8;
  b[7] = b[9] = m & 0xFF;
  b[21] = 0x03;
  let sum = 0; for (let i = 3; i <= 20; i++) sum += b[i];
  b[2] = sum & 0xFF;
  return b;
}

function onData(e) {
  const d = new Uint8Array(e.target.value.buffer);
  rxBytes += d.length;
  rxHex = [...d].map(x => x.toString(16).padStart(2, '0')).join(' ');
  for (const byte of d) {
    rx.push(byte);
    if (rx.length > 22) rx.shift();
    if (rx.length === 22 && rx[0] === 2 && rx[3] === 1 && rx[4] === 1 && rx[21] === 3) {
      ir = [0, 1, 2, 3, 4, 5].map(i => (rx[5 + i * 2] << 8) | rx[6 + i * 2]);
      lastRx = Date.now();
      rx = [];
      rxFrames++;
      showSensors();
    }
  }
  $('diag').textContent = `받은 바이트 ${rxBytes} / 센서 묶음 ${rxFrames} / 최근: ${rxHex}`;
}

async function write(u8) {
  if (writeCh.properties.writeWithoutResponse) await writeCh.writeValueWithoutResponse(u8);
  else await writeCh.writeValueWithResponse(u8);
}

async function sendLoop(ch) {
  while (writeCh === ch && device.gatt.connected) {
    try {
      const trim = Number($('trim').value) || 0;
      const f = buildFrame(speedNow, steerNow + trim);
      await write(f.slice(0, 14));   // 14 + 8 로 나눠 보냄
      await write(f.slice(14));
    } catch (e) { status('전송 오류: ' + e.message); }
    await sleep(80);
  }
}

$('connect').onclick = async () => {
  if (!navigator.bluetooth) return status('안드로이드 크롬 + https 주소에서 열어야 합니다');
  try {
    stopAll();
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ALTINO' }], optionalServices: [SVC]
    });
    device.ongattserverdisconnected = () => { writeCh = null; stopAll(); status('연결 끊김'); };
    status('연결 중…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const n = await svc.getCharacteristic(NOTIFY);
    await n.startNotifications();
    n.addEventListener('characteristicvaluechanged', onData);
    writeCh = await svc.getCharacteristic(WRITE);
    status('연결됨: ' + device.name +
      (device.name.toUpperCase().startsWith('ALTINO-L') ? '' : ' (라이트 이름이 아닙니다!)'));
    sendLoop(writeCh);
  } catch (e) { status('연결 실패: ' + e.message); }
};

/* ───── 센서 ───── */
const fresh = () => writeCh && ir && Date.now() - lastRx < STALE_MS;
const picks = () => [$('sL').value, $('sC').value, $('sR').value].map(Number);

/* 순회할 수 없는 이유. 문제가 없으면 빈 문자열 */
function problem() {
  if (!writeCh) return '알티노가 연결되지 않았습니다. 알티노 연결을 누르세요.';
  if (!ir) return '센서 값이 한 번도 오지 않았습니다. 2번 칸 아래 회색 글자를 알려주세요.';
  if (Date.now() - lastRx >= STALE_MS) return '센서 값이 끊겼습니다. 다시 연결해 보세요.';
  if (!cal.empty) return '① 앞을 비우고 누르기를 해주세요.';
  if (!cal.hand) return '② 앞을 판으로 막고 누르기를 해주세요.';
  const names = ['왼쪽 앞', '가운데', '오른쪽 앞'];
  const bad = [];
  picks().forEach((i, k) => {
    const diff = Math.abs(cal.hand[i] - cal.empty[i]);
    if (diff < 15) bad.push(`${names[k]}(ir${i + 1}): ① ${cal.empty[i]} → ② ${cal.hand[i]}`);
  });
  if (bad.length) return '①과 ②의 값 차이가 너무 작습니다.\n' + bad.join('\n') +
    '\n센서 선택을 확인하고 ①, ②를 다시 누르세요.';
  return '';
}

/* 가까움 0~100. 순회할 수 없는 상태면 null */
function front() {
  if (problem()) return null;
  return picks().map(i =>
    Math.round(clamp((ir[i] - cal.empty[i]) / (cal.hand[i] - cal.empty[i]) * 100, 0, 100)));
}

function showSensors() {
  [...$('raw').children].forEach((td, i) => td.textContent = ir[i]);
  const f = front();
  $('strength').textContent = f ? `가까움  왼 ${f[0]} / 가운데 ${f[1]} / 오른 ${f[2]}`
                                : problem();
}

function calibrate(key) {
  if (!fresh()) return status('센서 값이 안 옵니다');
  cal[key] = ir.slice(); save(); showSensors();
  status(key === 'empty' ? '① 저장' : '② 저장');
}
$('calEmpty').onclick = () => calibrate('empty');
$('calHand').onclick = () => calibrate('hand');

/* ───── 주행 ───── */
function drive(speed, steer) { speedNow = speed; steerNow = steer; }

function stopAll() {
  runId++; running = false; drive(0, 0);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
$('stop').onclick = () => { stopAll(); status('정지'); };
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });

document.querySelectorAll('[data-test]').forEach(btn => btn.onclick = async () => {
  if (!writeCh) return status('먼저 연결하세요');
  stopAll();
  const my = runId, v = Number($('speed').value), a = Number($('angle').value);
  const t = { f: [v, 0], b: [-v, 0], l: [0, -a], r: [0, a] }[btn.dataset.test];
  drive(t[0], t[1]);
  await sleep(1000);
  if (my === runId) drive(0, 0);
});

/* dir: -1 왼쪽, 0 직진, 1 오른쪽 / sign: 1 전진, -1 후진 */
function go(sign, dir) {
  drive(sign * Number($('speed').value), dir * Number($('angle').value));
}

async function moveFor(my, sign, dir, ms) {
  const end = Date.now() + ms;
  while (my === runId && Date.now() < end) {
    const f = front();
    if (!f) break;
    if (sign > 0 && f[1] >= TH_DANGER) break;
    go(sign, dir);
    await sleep(50);
  }
  if (my === runId) { drive(0, 0); await sleep(200); }
}

async function turnAround(my, dir) {
  status('유턴');
  await moveFor(my, -1, 0, BACK_MS);
  for (let i = 0; i < Number($('turns').value) && my === runId; i++) {
    await moveFor(my, 1, dir, TURN_FWD_MS);
    await moveFor(my, -1, -dir, TURN_BACK_MS);
  }
}

async function patrol(my) {
  let stuck = 0, clearSince = Date.now(), turnDir = -1;
  while (my === runId) {
    const f = front();
    if (!f) { const why = problem(); stopAll(); status('정지: ' + why); return; }
    const [l, c, r] = f;
    if (c >= TH_FRONT && l >= TH_SIDE && r >= TH_SIDE) {      // 복도 끝, 계단 막이
      await turnAround(my, turnDir);
      stuck = 0; clearSince = Date.now();
    } else if (Math.max(l, c, r) >= TH_DANGER) {              // 너무 가까움
      status('후진');
      await moveFor(my, -1, l > r ? -1 : 1, BACK_MS);
      clearSince = Date.now();
      if (++stuck >= STUCK_LIMIT) {
        await turnAround(my, turnDir);
        turnDir = -turnDir; stuck = 0;
      }
    } else {
      let dir = 0;
      if (c >= TH_FRONT) dir = l > r ? 1 : -1;
      else if (l >= TH_SIDE && l > r) dir = 1;
      else if (r >= TH_SIDE) dir = -1;
      go(1, dir);
      status(`${dir ? '피하는 중' : '직진'} (왼 ${l} / 가운데 ${c} / 오른 ${r})`);
      if (dir) clearSince = Date.now();
      else if (Date.now() - clearSince > 2000) stuck = 0;
    }
    await sleep(50);
  }
}

$('start').onclick = async () => {
  if (running) return;
  const why = problem();
  if (why) return status('출발 불가: ' + why);
  stopAll();
  running = true;
  const my = runId;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  for (let n = 3; n > 0 && my === runId; n--) { status(n + '초 뒤 출발'); await sleep(1000); }
  if (my === runId) patrol(my);
};
</script>
</body>
</html>
